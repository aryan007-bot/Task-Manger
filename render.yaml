services:
  - type: web
    name: task-manager
    runtime: docker
    dockerfilePath: Dockerfile
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: task-db
          property: connectionString

databases:
  - name: task-db
    plan: free
    databaseName: taskmanager
    ipAllowList: []
