services:
  - type: web
    name: task-manager
    env: docker
    dockerfilePath: Dockerfile
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: task-db
          property: connectionString
  - type: pserv
    name: task-db
    runtime: postgres
    ipAllowList: []