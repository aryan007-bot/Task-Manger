services:
  - type: web
    name: task-manager
    runtime: python3
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k eventlet -w 1 -b 0.0.0.0:$PORT run:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: task-db
          property: connectionString
  - type: pserv
    name: task-db
    runtime: postgres
    ipAllowList: []